<div class="min-h-screen bg-slate-100">
  <div *ngIf="isMobile && sidebarOpen" class="fixed inset-0 z-40 bg-slate-950/50" (click)="toggleSidebar()"></div>
  <aside class="fixed inset-y-0 left-0 z-50 flex w-[218px] flex-col bg-[#111827] transition-transform duration-300" [ngClass]="{'-translate-x-full': isMobile && !sidebarOpen, 'translate-x-0': !isMobile || sidebarOpen}">
    <div class="flex h-[94px] items-center border-b border-slate-700/60 px-7">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-white text-lg font-extrabold text-slate-900">C</div>
      <div class="ml-3"><div class="text-base font-bold text-white">Carsey</div><div class="text-[9px] font-medium tracking-wide text-slate-400">Employee</div></div>
    </div>
    <nav class="flex-1 space-y-1 px-2 py-4">
      <a routerLink="/employee/dashboard" routerLinkActive="bg-white text-slate-900" [routerLinkActiveOptions]="{exact:true}" (click)="closeSidebarOnMobile()" class="flex w-full items-center rounded-lg px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"><span class="text-lg leading-none">▦</span><span class="ml-3">Dashboard</span></a>
      <a routerLink="/employee/sell-car-requests" routerLinkActive="bg-white text-slate-900" (click)="closeSidebarOnMobile()" class="flex w-full items-center rounded-lg px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"><span class="text-lg leading-none">🚘</span><span class="ml-3">Sell Car Requests</span></a>
    </nav>
    <div class="border-t border-slate-700/60 px-2 py-4"><button type="button" (click)="logout()" class="flex w-full items-center rounded-lg px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"><span class="text-lg leading-none">↪</span><span class="ml-3">Logout</span></button></div>
  </aside>
  <div class="min-h-screen transition-all duration-300" [ngClass]="{'ml-[218px]': !isMobile, 'ml-0': isMobile}">
    <header class="sticky top-0 z-30 flex h-[60px] items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm sm:px-6">
      <div class="flex items-center"><button type="button" (click)="toggleSidebar()" class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50" aria-label="Toggle menu"><span class="text-xl leading-none">☰</span></button><div class="ml-4 text-sm font-semibold text-slate-900 sm:text-base">Employee Panel</div></div>
      <div class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5"><span class="h-2 w-2 rounded-full bg-green-500"></span><span class="text-xs font-semibold text-slate-700">Employee</span></div>
    </header>
    <main class="min-h-[calc(100vh-60px)]"><router-outlet></router-outlet></main>
  </div>
</div>
