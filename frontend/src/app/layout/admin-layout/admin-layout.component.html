<div class="min-h-screen w-full min-w-0 max-w-full overflow-x-hidden bg-slate-100">

  <!-- ========================================= -->
  <!-- SIDEBAR -->
  <!-- ========================================= -->

  <aside
  class="admin-sidebar fixed left-0 top-0 z-40 flex h-screen flex-col bg-slate-900 text-white shadow-xl"
  [class.hidden]="!sidebarOpen"
>

    <!-- ========================================= -->
    <!-- LOGO -->
    <!-- ========================================= -->

    <div
  class="admin-logo flex shrink-0 items-center border-b border-slate-700 px-6"
>
      <div>
        <h1 class="text-2xl font-bold">
          Carsey.in
        </h1>

        <p class="text-xs text-slate-400">
          Admin Panel
        </p>
      </div>
    </div>


    <!-- ========================================= -->
    <!-- NAVIGATION -->
    <!-- ========================================= -->

    <nav
  class="admin-nav min-h-0 flex-1 space-y-1 overflow-y-auto"
>

      <!-- DASHBOARD -->

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-slate-700 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>📊</span>

        <span class="ml-3">
          Dashboard
        </span>
      </a>


      <!-- ========================================= -->
      <!-- VEHICLES -->
      <!-- ========================================= -->

      <div
        class="mt-5 px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
      >
        Vehicles
      </div>


      <!-- ALL VEHICLES -->

      <a
        routerLink="/admin/vehicles"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🚗</span>

        <span class="ml-3">
          All Vehicles
        </span>
      </a>


      <!-- ADD VEHICLE -->

      <a
        routerLink="/admin/vehicles/add"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>➕</span>

        <span class="ml-3">
          Add Vehicle
        </span>
      </a>


      <!-- ========================================= -->
      <!-- REQUESTS -->
      <!-- ========================================= -->

      <div
        class="mt-5 px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
      >
        Requests
      </div>


      <!-- REPORT UNLOCK -->

      <a
        routerLink="/admin/report-unlock-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🔓</span>

        <span class="ml-3">
          Report Unlock
        </span>
      </a>


      <!-- TEST DRIVE -->

      <a
        routerLink="/admin/test-drive-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🚘</span>

        <span class="ml-3">
          Test Drive
        </span>
      </a>


      <!-- FINANCE -->

      <a
        routerLink="/admin/finance-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>💰</span>

        <span class="ml-3">
          Finance
        </span>
      </a>


      <!-- SELL CAR -->

      <a
        routerLink="/admin/sell-car-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🚙</span>

        <span class="ml-3">
          Sell Car
        </span>
      </a>


      <!-- EXCHANGE -->

      <a
        routerLink="/admin/exchange-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🔄</span>

        <span class="ml-3">
          Exchange
        </span>
      </a>


      <!-- LOAN -->

      <a
        routerLink="/admin/loan-requests"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>🏦</span>

        <span class="ml-3">
          Loan
        </span>
      </a>


      <!-- ========================================= -->
      <!-- INSPECTION -->
      <!-- ========================================= -->

      <div
        class="mt-5 px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
      >
        Inspection
      </div>


      <!-- BOOKINGS -->

      <a
        routerLink="/admin/inspection-bookings"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>📅</span>

        <span class="ml-3">
          Bookings
        </span>
      </a>


      <!-- REPORTS -->

      <a
        routerLink="/admin/inspection-reports"
        routerLinkActive="bg-slate-700 text-white"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-slate-800 hover:text-white"
      >
        <span>📄</span>

        <span class="ml-3">
          Reports
        </span>
      </a>

    </nav>


    <!-- ========================================= -->
    <!-- LOGOUT -->
    <!-- ========================================= -->

    <div
      class="shrink-0 border-t border-slate-700 bg-slate-900 p-4"
    >
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center rounded-lg px-4 py-3 text-slate-300 transition hover:bg-red-600 hover:text-white"
      >
        <span>🚪</span>

        <span class="ml-3">
          Logout
        </span>
      </button>
    </div>

  </aside>


  <!-- ========================================= -->
  <!-- MAIN AREA -->
  <!-- ========================================= -->

<div
  class="main-area min-h-screen min-w-0 max-w-full"
  [class.sidebar-open]="sidebarOpen"
  [class.sidebar-closed]="!sidebarOpen"
>
    <!-- ======================================= -->
    <!-- NAVBAR -->
    <!-- ======================================= -->

    <header
      class="sticky top-0 z-30 flex h-20 w-full min-w-0 items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm sm:px-6"
    >

      <!-- LEFT -->

      <div
        class="flex min-w-0 items-center gap-4"
      >

        <button
          type="button"
          (click)="toggleSidebar()"
          class="shrink-0 rounded-lg border border-slate-200 px-3 py-2 text-xl hover:bg-slate-100"
        >
          ☰
        </button>


        <div class="min-w-0">

          <h2
            class="truncate text-lg font-bold text-slate-800"
          >
            Admin Dashboard
          </h2>

          <p
            class="truncate text-xs text-slate-500"
          >
            Carsey.in Management System
          </p>

        </div>

      </div>


      <!-- RIGHT -->

      <div
        class="flex shrink-0 items-center gap-3 sm:gap-4"
      >

        <div
          class="hidden text-right sm:block"
        >

          <p
            class="text-sm font-semibold text-slate-800"
          >
            Admin
          </p>

          <p
            class="text-xs text-slate-500"
          >
            Administrator
          </p>

        </div>


        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-900 font-bold text-white"
        >
          A
        </div>

      </div>

    </header>


    <!-- ======================================= -->
    <!-- PAGE CONTENT -->
    <!-- ======================================= -->

    <main
      class="w-full min-w-0 max-w-full overflow-x-hidden p-4 sm:p-6"
    >

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
