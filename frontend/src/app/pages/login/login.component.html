<div
  class="flex min-h-screen items-center justify-center bg-slate-100 px-4"
>
  <div
    class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl"
  >

    <!-- Logo / Title -->

    <div class="mb-8 text-center">

      <h1
        class="text-3xl font-bold text-slate-900"
      >
        Carsey.in
      </h1>

      <p
        class="mt-2 text-sm text-slate-500"
      >
        Admin / Employee Login
      </p>

    </div>


    <!-- Error -->

    @if (errorMessage) {

      <div
        class="mb-5 rounded-lg border border-red-200 bg-red-50 p-4"
      >

        <p
          class="text-sm font-medium text-red-600"
        >
          {{ errorMessage }}
        </p>

      </div>

    }


    <!-- Login Form -->

    <form
      (ngSubmit)="login()"
      class="space-y-5"
    >

      <!-- Email -->

      <div>

        <label
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
        />

      </div>


      <!-- Password -->

      <div>

        <label
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Password
        </label>

        <!-- Password Input Wrapper -->

        <div class="relative">

          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 pr-12 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
          />

          <!-- Show / Hide Password -->

          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute right-3 top-1/2 flex -translate-y-1/2 items-center justify-center rounded-md p-1 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.title]="showPassword ? 'Hide password' : 'Show password'"
          >

            @if (showPassword) {

              <!-- Eye Off Icon -->

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="h-5 w-5"
              >

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.858-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.5a10.523 10.523 0 0 1-4.293 5.143M6.228 6.228 3 3m3.228 3.228 3.29 3.29m4.964 4.964 3.29 3.29M9.52 9.52a3.5 3.5 0 0 0 4.96 4.96M14.48 14.48 21 21"
                />

              </svg>

            } @else {

              <!-- Eye Icon -->

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="h-5 w-5"
              >

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5c4.64 0 8.577 3.01 9.964 7.178.07.21.07.434 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.64 0-8.577-3.01-9.964-7.178Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />

              </svg>

            }

          </button>

        </div>

      </div>


      <!-- Submit -->

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-lg bg-slate-900 px-4 py-3 font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
      >

        @if (loading) {

          Logging in...

        } @else {

          Login

        }

      </button>

    </form>

  </div>
</div>
