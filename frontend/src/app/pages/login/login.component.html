<div
  class="flex min-h-screen items-center justify-center bg-slate-100 px-4"
>

  <div
    class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl"
  >

    <!-- Logo / Title -->

    <div class="mb-8 text-center">

      <h1
        class="text-3xl font-bold text-slate-900"
      >
        Carsey.in
      </h1>

      <p
        class="mt-2 text-sm text-slate-500"
      >
        Admin Login
      </p>

    </div>


    <!-- Error -->

    @if (errorMessage) {

      <div
        class="mb-5 rounded-lg border border-red-200 bg-red-50 p-4"
      >

        <p
          class="text-sm font-medium text-red-600"
        >
          {{ errorMessage }}
        </p>

      </div>

    }


    <!-- Login Form -->

    <form
      (ngSubmit)="login()"
      class="space-y-5"
    >

      <!-- Email -->

      <div>

        <label
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"

          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
        />

      </div>


      <!-- Password -->

      <div>

        <label
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"

          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200"
        />

      </div>


      <!-- Submit -->

      <button
        type="submit"
        [disabled]="loading"

        class="w-full rounded-lg bg-slate-900 px-4 py-3 font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
      >

        @if (loading) {

          Logging in...

        } @else {

          Login

        }

      </button>

    </form>

  </div>

</div>
